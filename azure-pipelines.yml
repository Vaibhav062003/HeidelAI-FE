trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: github-secrets
  GIT_REDACT_URLS: false
  GIT_HTTP_USER_AGENT: "Azure-DevOps-Sync/1.0"

steps:
- checkout: self
  persistCredentials: true
  clean: false
  fetchDepth: 0  # Critical: Get full repository history

- script: |
    set -exo pipefail

    # Configure Git environment
    git config --global user.email "egeniestore@gmail.com"
    git config --global user.name "Azure DevOps Syncer"
    git config --global http.version HTTP/1.1
    git config --global http.postBuffer 524288000
    git config --global pack.windowMemory 512m

    # Add GitHub remote with authentication
    git remote add github https://oauth2:$(GITHUB_PAT)@github.com/egenie4u/heidelAIWebsite.git

    # Verify repository integrity
    echo "=== Repository Integrity Check ==="
    git fsck --full --strict

    # Synchronize branches
    echo "=== Synchronization Process ==="
    retry_count=0
    max_retries=3
    
    while [ $retry_count -lt $max_retries ]; do
        git fetch --all --prune --tags
        LOCAL_COMMIT=$(git rev-parse HEAD)
        REMOTE_COMMIT=$(git ls-remote github main | awk '{print $1}')
        
        echo "Local Commit: ${LOCAL_COMMIT:0:7}"
        echo "Remote Commit: ${REMOTE_COMMIT:0:7}"
        
        if [ "$LOCAL_COMMIT" != "$REMOTE_COMMIT" ]; then
            echo "Attempt $((retry_count+1)) of $max_retries: Pushing changes..."
            git push github HEAD:main \
                --force-with-lease \
                --no-thin \
                --progress \
                --atomic \
                2>&1 | tee push.log
        
            if grep -q "error: " push.log; then
                ((retry_count++))
                echo "Push failed, retrying in 15 seconds..."
                sleep 15
            else
                echo "Push successful!"
                break
            fi
        else
            echo "Repositories already synchronized"
            exit 0
        fi
    done
    
    if [ $retry_count -eq $max_retries ]; then
        echo "##vso[task.logissue type=error]Failed after $max_retries attempts"
        exit 1
    fi

    # Final verification
    echo "=== Post-Push Verification ==="
    git ls-remote --heads github
    git diff --exit-code HEAD github/main
  displayName: 'GitHub Repository Sync'
  env:
    GIT_TRACE: 1
    GIT_CURL_VERBOSE: 1
    GIT_TRACE_PACKET: 1

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'push.log'
    ArtifactName: 'GitLogs'
  condition: always()
