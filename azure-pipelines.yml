trigger:
  branches:
    include:
      - main  # Trigger on changes to the main branch in Azure DevOps

pool:
  vmImage: ubuntu-latest

variables:
  - group: github-secrets  # Reference the variable group containing GITHUB_PAT

steps:
- checkout: self  # Check out the Azure DevOps repository

- script: |
    # Configure Git with the GitHub PAT
    git config --global user.email "egeniestore@gmail.com"
    git config --global user.name "Azure Pipeline"

    # Add GitHub as a remote
    git remote add github https://$(GITHUB_PAT)@github.com/egenie4u/heidelAIWebsite.git

    # Push changes to GitHub
    git push github HEAD:main --force --no-verify

    echo "Azure DevOps changes have been pushed to GitHub"
  displayName: 'Push changes to GitHub'